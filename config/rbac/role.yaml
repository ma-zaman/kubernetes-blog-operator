---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - platform.alizaman.fr
  resources:
  - bloginstances
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - platform.alizaman.fr
  resources:
  - bloginstances/finalizers
  verbs:
  - update
- apiGroups:
  - platform.alizaman.fr
  resources:
  - bloginstances/status
  verbs:
  - get
  - patch
  - update
